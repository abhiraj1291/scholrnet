name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Deploy to Vercel
        run: npx vercel@34 deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
