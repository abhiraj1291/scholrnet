{% extends "base.html" %}
{% block content %}
<div style="max-width:56rem;margin:0 auto;">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-black">Clubs</h1>
    <button class="btn btn-primary btn-sm" onclick="showCreateClubModal()"><i data-lucide="plus" style="width:16px;height:16px;"></i> New Club</button>
  </div>

  <!-- Search -->
  <div class="mb-4">
    <input type="text" id="clubSearch" placeholder="Search clubs..." inputmode="search" autocomplete="off" class="w-full">
  </div>

  <!-- Club Grid -->
  <div id="clubGrid" class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem;"></div>
  <div id="clubSkeleton" class="fade-in">
    {% for i in range(4) %}
    <div class="card skeleton-card"><div class="skeleton skeleton-md"></div><div class="skeleton skeleton-sm"></div><div class="skeleton skeleton-sm" style="width:30%;"></div></div>
    {% endfor %}
  </div>
  <div id="clubEmpty" class="hidden text-center py-8 text-muted text-sm">No clubs found. Create one!</div>
</div>

<!-- Create Club Modal -->
<div id="createClubModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span class="font-bold">Create Club</span>
      <button id="closeCreateClub" class="btn btn-ghost btn-sm"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
    </div>
    <div class="modal-body">
      <form id="createClubForm">
        <div class="mb-3">
          <label class="text-xs font-bold text-muted block mb-1">Club Name *</label>
          <input type="text" id="clubName" placeholder="e.g. Science Club" required maxlength="200">
        </div>
        <div class="mb-3">
          <label class="text-xs font-bold text-muted block mb-1">Description</label>
          <textarea id="clubDesc" rows="4" placeholder="What is this club about?" maxlength="5000"></textarea>
        </div>
        <div class="mb-3">
          <label class="text-xs font-bold text-muted block mb-1">Tags (comma separated)</label>
          <input type="text" id="clubTags" placeholder="e.g. science, research, debate">
        </div>
        <button type="submit" class="btn btn-primary w-full">Create Club</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showCreateClubModal() {
  document.getElementById('createClubModal').classList.remove('hidden');
}

document.getElementById('closeCreateClub').addEventListener('click', function() {
  document.getElementById('createClubModal').classList.add('hidden');
});

document.getElementById('createClubModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.add('hidden');
});

document.getElementById('createClubForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var name = document.getElementById('clubName').value.trim();
  if (!name) return;
  fetch('/api/club/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: name,
      description: document.getElementById('clubDesc').value.trim(),
      tags: document.getElementById('clubTags').value.trim()
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      document.getElementById('createClubModal').classList.add('hidden');
      document.getElementById('createClubForm').reset();
      showToast('Club created!', 'success');
      loadClubs();
    } else {
      showToast(d.error || 'Failed to create club', 'info');
    }
  })
  .catch(function() { showToast('Network error', 'info'); });
});

function loadClubs(q) {
  var url = '/api/clubs';
  if (q) url += '?q=' + encodeURIComponent(q);
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('clubSkeleton').classList.add('hidden');
      var grid = document.getElementById('clubGrid');
      grid.innerHTML = '';
      if (!data.clubs || data.clubs.length === 0) {
        document.getElementById('clubEmpty').classList.remove('hidden');
        return;
      }
      document.getElementById('clubEmpty').classList.add('hidden');
      data.clubs.forEach(function(c) {
        var div = document.createElement('a');
        div.href = '/club/' + c.id;
        div.style.textDecoration = 'none';
        div.style.color = 'inherit';
        div.className = 'card';
        div.style.cursor = 'pointer';
        div.style.display = 'block';
        div.innerHTML = '<div class="font-bold text-sm mb-1">' + escapeHtml(c.name) + '</div>' +
          '<div class="text-xs text-muted mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + escapeHtml(c.description || 'No description') + '</div>' +
          '<div class="flex items-center gap-3 text-xs text-muted"><span><i data-lucide="users" style="width:14px;height:14px;display:inline;"></i> ' + c.member_count + ' members</span></div>';
        grid.appendChild(div);
      });
      if (typeof lucide !== 'undefined') lucide.createIcons();
    })
    .catch(function() {});
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Search debounce
var searchTimer;
document.getElementById('clubSearch').addEventListener('input', function() {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  searchTimer = setTimeout(function() { loadClubs(q); }, 300);
});

document.addEventListener('DOMContentLoaded', function() {
  loadClubs();
});
</script>
{% endblock %}
