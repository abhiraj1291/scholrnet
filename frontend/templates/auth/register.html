<!DOCTYPE html>
<html lang="en" class="{{ 'dark' if request.cookies.get('theme') == 'dark' else '' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholrNet - Register</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  // Username availability check on registration form
  const regUsername = document.getElementById('regUsername');
  const usernameStatus = document.getElementById('usernameStatus');
  let checkTimer = null;
  if (regUsername) {
    regUsername.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      if (!val) { usernameStatus.textContent = '3-30 chars: letters, numbers, underscores'; usernameStatus.style.color = ''; return; }
      if (!/^[a-z0-9_]{3,30}$/.test(val)) { usernameStatus.textContent = 'Invalid characters'; usernameStatus.style.color = 'var(--danger)'; return; }
      usernameStatus.textContent = 'Checking...'; usernameStatus.style.color = 'var(--text-muted)';
      clearTimeout(checkTimer);
      checkTimer = setTimeout(() => {
        fetch('/api/username/check?u=' + encodeURIComponent(val))
          .then(r => r.json())
          .then(d => { usernameStatus.textContent = d.available ? 'Available' : (d.error || 'Taken'); usernameStatus.style.color = d.available ? 'var(--success)' : 'var(--danger)'; })
          .catch(() => { usernameStatus.textContent = 'Error checking'; usernameStatus.style.color = 'var(--danger)'; });
      }, 300);
    });
  }
  </script>
  <meta name="google-site-verification" content="H-dGB8FAwUgmXrVFB6_J5cut2rxyDSSKsvoSrY7DTeE" />
</head>
<body class="flex items-center justify-center min-h-screen p-4" style="background: var(--bg);">
  <div class="card" style="max-width: 24rem; width: 100%; padding: 2rem;">
    <style>@media (max-width: 30rem) { .card { padding: 1.25rem !important; } }</style>
    <div class="flex items-center gap-2 mb-4">
      <div class="logo">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="ScholrNet" height="28" class="logo-light">
        <img src="{{ url_for('static', filename='logo-dark.svg') }}" alt="ScholrNet" height="28" class="logo-dark">
      </div>
    </div>
    <h1 class="text-lg font-black mb-1">Create your profile</h1>
    <p class="text-sm text-muted mb-4">Join the academic trust network</p>

    {% if error %}
      <div class="toast success" style="position: static; margin-bottom: 1rem;">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div style="margin-bottom: 0.75rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">Full Name</label>
        <input type="text" id="regName" name="name" placeholder="e.g. Aarav Sharma" required>
      </div>
      <div style="margin-bottom: 0.75rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">Email</label>
        <input type="email" id="regEmail" name="email" placeholder="your@email.com" required>
      </div>
      <div style="margin-bottom: 0.75rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">Password</label>
        <input type="password" id="regPassword" name="password" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <div style="margin-bottom: 0.75rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">Username <span class="text-xs text-muted">(optional, set later)</span></label>
        <input type="text" id="regUsername" name="username" placeholder="e.g. aarav_sharma" maxlength="30">
        <div id="usernameStatus" class="text-xs text-muted mt-1">3-30 chars: letters, numbers, underscores</div>
      </div>
      <div style="margin-bottom: 0.75rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">School / Institution</label>
        <input type="text" id="regSchool" name="school" placeholder="e.g. Delhi Public School">
      </div>
      <div style="margin-bottom: 1rem;">
        <label class="text-xs font-bold text-muted" style="display: block; margin-bottom: 0.25rem;">Role</label>
        <select id="regRole" name="role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="mentor">Mentor</option>
          <option value="admin">School Counselor</option>
        </select>
      </div>
      {% if turnstile_site_key %}
      <div class="cf-turnstile mb-4" data-sitekey="{{ turnstile_site_key }}" data-theme="{{ 'dark' if request.cookies.get('theme') == 'dark' else 'light' }}"></div>
      <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
      {% endif %}
      <button type="submit" class="btn btn-primary w-full" style="padding: 0.75rem;">Create Account</button>
    </form>

    <p class="text-xs text-muted text-center mt-4">
      Already registered? <a href="{{ url_for('login') }}" class="font-bold">Sign in</a>
    </p>
  </div>
</body>
</html>
