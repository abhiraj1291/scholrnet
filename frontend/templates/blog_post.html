<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} — ScholrNet Blog</title>
  <meta name="description" content="{{ post.excerpt or '' }}">
  <meta property="og:title" content="{{ post.title }} — ScholrNet Blog">
  <meta property="og:description" content="{{ post.excerpt or '' }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ request.url }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo-icon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}?v=5">
  <style>
    body{background:var(--bg-alt);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
    .blog-post{max-width:720px;margin:3rem auto;padding:0 1.5rem;flex:1;width:100%}
    .blog-post-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem;box-shadow:var(--shadow-md)}
    .blog-post-tag{display:inline-block;padding:0.25rem 0.75rem;border-radius:999px;font-size:0.75rem;font-weight:600;background:var(--primary-light);color:var(--primary);margin-bottom:0.75rem}
    .blog-post h1{font-size:1.75rem;font-weight:800;color:var(--text);margin-bottom:0.5rem;letter-spacing:-0.02em;line-height:1.3}
    .blog-post-meta{font-size:0.8rem;color:var(--text-muted);margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border-light)}
    .blog-post-content{font-size:0.95rem;color:var(--text-secondary);line-height:1.8}
    .blog-post-content h2{font-size:1.25rem;font-weight:700;color:var(--text);margin:1.5rem 0 0.75rem}
    .blog-post-content h3{font-size:1.05rem;font-weight:600;color:var(--text);margin:1.25rem 0 0.5rem}
    .blog-post-content p{margin-bottom:1rem}
    .blog-post-content ul,.blog-post-content ol{margin-bottom:1rem;padding-left:1.5rem}
    .blog-post-content li{margin-bottom:0.375rem}
    .blog-post-content a{color:var(--primary);text-decoration:underline}
    .blog-post-content a:hover{text-decoration:none}
    .back-link{display:inline-flex;align-items:center;gap:0.375rem;font-size:0.85rem;color:var(--primary);margin-bottom:1.5rem}
    .back-link:hover{text-decoration:underline}
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ post.title }}",
    "description": "{{ post.excerpt or '' }}",
    "author": {"@type": "Person", "name": "{{ post.author }}"},
    "datePublished": "{{ post.created_at or '' }}",
    "dateModified": "{{ post.updated_at or '' }}"
  }
  </script>
</head>
<body>
  <div class="blog-post">
    <a href="{{ url_for('main.blog_index') }}" class="back-link">&larr; All Resources</a>
    <article class="blog-post-card">
      <div class="blog-post-tag">{{ post.category or 'Guide' }}</div>
      <h1>{{ post.title }}</h1>
      <div class="blog-post-meta">By {{ post.author }} &middot; {{ post.created_at or '' }}</div>
      <div class="blog-post-content">{{ post.content|safe }}</div>
    </article>
  </div>
  <footer class="footer" style="margin-top:auto">
    <div class="footer-inner">
      <div class="footer-bottom" style="border:none;padding-top:0">
        <span>&copy; 2026 ScholrNet</span>
      </div>
    </div>
  </footer>
</body>
</html>
