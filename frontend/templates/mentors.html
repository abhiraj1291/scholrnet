{% extends "base.html" %}
{% block content %}
<div style="max-width:64rem;margin:0 auto;">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-xl font-black">Mentors</h1>
      <p class="text-sm text-muted">Connect with academic mentors and industry experts</p>
    </div>
  </div>

  <!-- Mentor Cards Grid -->
  <div id="mentorGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:1rem;"></div>

<script>
var MENTORS_DATA = [
  {% for m in mentors %}
  {
    id: {{ m.id }},
    name: {{ m.name|tojson|safe }},
    role: {{ m.role|tojson|safe }},
    institution: {{ m.institution|tojson|safe }},
    subjects: {% if m.subjects %}{{ m.subjects|tojson|safe }}{% else %}[]{% endif %},
    bio: {{ m.bio|tojson|safe }},
    rating: {{ m.rating }}
  }{% if not loop.last %},{% endif %}
  {% endfor %}
];
var MENTORSHIP_DATA = [
  {% for r in mentorship_requests %}
  {
    id: {{ r.id }},
    mentor_name: {{ r.mentor_name|tojson|safe }},
    subject: {{ r.subject|tojson|safe }},
    message: {{ r.message|tojson|safe }},
    status: {{ r.status|tojson|safe }}
  }{% if not loop.last %},{% endif %}
  {% endfor %}
];
</script>

<!-- My Mentorship Requests -->
<div class="card mt-4">
  <div class="flex items-center gap-2 mb-3">
    <i data-lucide="send" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
    <span class="font-bold text-sm">My Mentorship Requests</span>
  </div>
  <div id="myRequests"></div>
</div>

  <!-- Mentorship Request Modal -->
  <div id="mentorModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span class="font-bold">Request Mentorship</span>
        <button id="closeMentorModal" class="btn btn-ghost btn-sm"><i data-lucide="x" style="width:1.25rem;height:1.25rem;"></i></button>
      </div>
      <div class="modal-body">
        <form id="mentorRequestForm">
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">Mentor</label>
            <input type="text" id="mentorName" readonly style="background:var(--bg-hover);">
          </div>
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">Subject</label>
            <input type="text" id="mentorSubject" placeholder="e.g. Machine Learning, Physics Olympiad" required>
          </div>
          <div class="mb-3">
            <label class="text-xs font-bold text-muted block mb-1">Message</label>
            <textarea id="mentorMessage" rows="3" placeholder="Tell the mentor why you'd like their guidance..." required></textarea>
          </div>
          <input type="hidden" id="mentorId" value="">
          <button type="submit" class="btn btn-primary w-full" style="padding:0.625rem;">Send Request</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Mentor modal controls
  var mentorModal = document.getElementById('mentorModal');
  document.getElementById('closeMentorModal').addEventListener('click', function() {
    mentorModal.classList.add('hidden');
  });
  mentorModal.addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  // Render mentors from server data
  function renderMentors() {
    var grid = document.getElementById('mentorGrid');
    grid.innerHTML = '';
    if (MENTORS_DATA.length > 0) {
      MENTORS_DATA.forEach(function(m) {
        var el = document.createElement('div');
        el.className = 'card flex flex-col';
        var rating = m.rating || 0;
        var starsHtml = '';
        for (var i = 1; i <= 5; i++) {
          starsHtml += '<i data-lucide="star" style="width:0.875rem;height:0.875rem;' + (i <= rating ? 'color:var(--accent);fill:var(--accent);' : 'color:var(--text-light);') + '"></i>';
        }
        var subjects = Array.isArray(m.subjects) ? m.subjects : [];
        el.innerHTML =
          '<div class="flex items-center gap-3 mb-3">' +
            '<div class="avatar" style="width:3rem;height:3rem;font-size:0.875rem;">' + (m.name ? m.name.slice(0,2).toUpperCase() : '??') + '</div>' +
            '<div style="flex:1;min-width:0;">' +
              '<div class="font-bold">' + escapeHtml(m.name || 'Unknown') + '</div>' +
              (m.role ? '<div class="text-xs text-muted">' + escapeHtml(m.role) + '</div>' : '') +
              (m.institution ? '<div class="text-xs text-muted">' + escapeHtml(m.institution) + '</div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-1 mb-2">' + starsHtml + '</div>' +
          (m.bio ? '<p class="text-xs text-muted mb-3" style="line-height:1.5;">' + escapeHtml(m.bio) + '</p>' : '') +
          (subjects.length > 0 ? '<div class="skills mb-3">' + subjects.map(function(s) { return '<span class="skill">' + s + '</span>'; }).join('') + '</div>' : '') +
          '<button class="btn btn-primary btn-sm w-full mt-auto open-mentor-request" data-id="' + m.id + '" data-name="' + escapeHtml(m.name || 'Mentor') + '">Request Mentorship</button>';
        grid.appendChild(el);
      });
      lucide.createIcons();
    } else {
      grid.innerHTML = '<div class="text-center text-muted text-sm py-8 col-span-full"><i data-lucide="graduation-cap" style="width:2rem;height:2rem;margin:0 auto 0.5rem;display:block;"></i> No mentors available yet</div>';
      lucide.createIcons();
    }

    // Open mentor request modal
    document.querySelectorAll('.open-mentor-request').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        var name = this.getAttribute('data-name');
        document.getElementById('mentorId').value = id;
        document.getElementById('mentorName').value = name;
        document.getElementById('mentorSubject').value = '';
        document.getElementById('mentorMessage').value = '';
        mentorModal.classList.remove('hidden');
        lucide.createIcons();
      });
    });
  }

  // Render mentorship requests from server data
  function renderMentorship() {
    var container = document.getElementById('myRequests');
    container.innerHTML = '';
    if (MENTORSHIP_DATA.length > 0) {
      MENTORSHIP_DATA.forEach(function(r) {
        var el = document.createElement('div');
        el.className = 'flex items-center justify-between p-3 rounded-xl mb-2';
        el.style.background = 'var(--bg-hover)';
        var statusClass = 'badge-warning';
        var statusText = 'Pending';
        if (r.status === 'accepted') { statusClass = 'badge-success'; statusText = 'Accepted'; }
        else if (r.status === 'rejected') { statusClass = 'badge-muted'; statusText = 'Rejected'; }
        el.innerHTML =
          '<div>' +
            '<div class="text-sm font-bold">' + escapeHtml(r.mentor_name || 'Mentor') + '</div>' +
            '<div class="text-xs text-muted">' + escapeHtml(r.subject || '') + '</div>' +
            (r.message ? '<div class="text-xs text-muted mt-1">' + escapeHtml(r.message) + '</div>' : '') +
          '</div>' +
          '<span class="badge ' + statusClass + '">' + statusText + '</span>';
        container.appendChild(el);
      });
    } else {
      container.innerHTML = '<div class="text-center text-muted text-xs py-4">No mentorship requests sent yet</div>';
    }
  }

  // Mentor request form submit
  document.getElementById('mentorRequestForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var body = {
      mentorId: parseInt(document.getElementById('mentorId').value),
      subject: document.getElementById('mentorSubject').value,
      message: document.getElementById('mentorMessage').value
    };
    fetch('/api/mentorship/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        mentorModal.classList.add('hidden');
        showToast('Mentorship request sent!', 'success');
        window.location.reload();
      } else {
        showToast(data.error || 'Error sending request', 'info');
      }
    })
    .catch(function() { showToast('Error sending request', 'info'); });
  });

  function escapeHtml(text) {
    if (!text) return '';
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  renderMentors();
  renderMentorship();
});
</script>
{% endblock %}
