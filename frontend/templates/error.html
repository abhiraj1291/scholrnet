<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} - ScholrNet</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo-icon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0" defer></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#f6f7fb 0%,#f0edff 100%);color:#0F0F1A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;-webkit-font-smoothing:antialiased}
    .error-card{background:#fff;border-radius:20px;padding:3rem 2.5rem;text-align:center;max-width:32rem;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.08),0 8px 20px rgba(0,0,0,0.04);border:1px solid #f0f0f5;position:relative;overflow:hidden}
    .error-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6C3BF5,#00C4B8)}
    .error-emoji{font-size:3rem;margin-bottom:0.5rem;display:block}
    .error-code{font-size:5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#6C3BF5,#8B6CFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.04em}
    .error-title{font-size:1.25rem;font-weight:700;margin-top:0.75rem;color:#0F0F1A}
    .error-msg{font-size:0.875rem;color:#5A5A72;margin-top:0.5rem;line-height:1.65;max-width:24rem;margin-left:auto;margin-right:auto}
    .error-actions{display:flex;gap:0.75rem;justify-content:center;margin-top:1.75rem;flex-wrap:wrap}
    .error-btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;font-size:0.875rem;font-weight:700;border-radius:10px;text-decoration:none;transition:all 0.2s ease;cursor:pointer;border:none;font-family:inherit}
    .error-btn-primary{background:#6C3BF5;color:#fff;box-shadow:0 4px 12px rgba(108,59,245,0.25)}
    .error-btn-primary:hover{background:#5A2ED8;transform:translateY(-2px);box-shadow:0 6px 16px rgba(108,59,245,0.3)}
    .error-btn-secondary{background:#f6f7fb;color:#0F0F1A;border:1px solid #e8e8f0}
    .error-btn-secondary:hover{background:#f0edff;border-color:#6C3BF5;color:#6C3BF5;transform:translateY(-2px)}
    @media(max-width:30rem){.error-card{padding:2rem 1.25rem}.error-code{font-size:3.5rem}.error-emoji{font-size:2.5rem}}
  </style>
</head>
<body>
  <div class="error-card">
    <span class="error-emoji" aria-hidden="true">{{ emoji }}</span>
    <div class="error-code" role="heading" aria-level="1">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-msg">{{ message }}</p>
    <div class="error-actions">
      <a href="/" class="error-btn error-btn-primary"><i data-lucide="home" style="width:16px;height:16px;"></i> Go Home</a>
      <a href="javascript:history.back()" class="error-btn error-btn-secondary"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Go Back</a>
    </div>
  </div>
  <script nonce="{{ csp_nonce }}">if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>
