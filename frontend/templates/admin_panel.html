{% extends "base.html" %}
{% block content %}
<div style="max-width:56rem;margin:0 auto;">
  <h1 class="text-xl font-black mb-4">Admin Panel</h1>

  <!-- Manage Schools -->
  <div class="card mb-3">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="building-2" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
        <span class="font-bold text-sm">Manage Schools</span>
      </div>
      <button id="toggleSchoolFormBtn" class="btn btn-primary btn-sm"><i data-lucide="plus" style="width:1rem;height:1rem;"></i> Add School</button>
    </div>
    <div id="schoolFormContainer" class="hidden mb-3 p-3 rounded-xl" style="background:var(--bg-hover);">
      <form id="schoolForm">
        <div class="mb-2">
          <label class="text-xs font-bold text-muted block mb-1">School Name</label>
          <input type="text" id="schoolName" class="w-full" required placeholder="e.g. Delhi Public School">
        </div>
        <div class="mb-2">
          <label class="text-xs font-bold text-muted block mb-1">Location</label>
          <input type="text" id="schoolLocation" class="w-full" placeholder="e.g. New Delhi">
        </div>
        <div class="mb-2">
          <label class="text-xs font-bold text-muted block mb-1">Tagline</label>
          <input type="text" id="schoolTagline" class="w-full" placeholder="e.g. Service Before Self">
        </div>
        <div class="mb-3">
          <label class="text-xs font-bold text-muted block mb-1">About</label>
          <textarea id="schoolAbout" rows="2" class="w-full" placeholder="Brief description..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="padding:0.625rem;">Create School</button>
      </form>
    </div>
    <div id="schoolsList"></div>
  </div>

  <!-- Manage Ads -->
  <div class="card mb-3">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="image" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
        <span class="font-bold text-sm">Manage Ads</span>
      </div>
      <button id="toggleAdFormBtn" class="btn btn-primary btn-sm"><i data-lucide="plus" style="width:1rem;height:1rem;"></i> Create Ad</button>
    </div>
    <div id="adFormContainer" class="hidden mb-3 p-3 rounded-xl" style="background:var(--bg-hover);">
      <form id="adForm">
        <div class="grid gap-2 ad-form-grid">
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">Title</label>
            <input type="text" id="adTitle" placeholder="Ad title" required>
          </div>
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">Company</label>
            <input type="text" id="adCompany" placeholder="Company name" required>
          </div>
        </div>
        <div class="mb-2">
          <label class="text-xs font-bold text-muted block mb-1">Content</label>
          <textarea id="adContent" rows="2" placeholder="Ad description" required></textarea>
        </div>
        <div class="grid gap-2 ad-form-grid-3">
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">CTA Text</label>
            <input type="text" id="adCtaText" placeholder="Learn More">
          </div>
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">CTA URL</label>
            <input type="url" id="adCtaUrl" placeholder="https://...">
          </div>
          <div class="mb-2">
            <label class="text-xs font-bold text-muted block mb-1">Placement</label>
            <select id="adPlacement">
              <option value="sidebar">Sidebar</option>
              <option value="in-feed">In-feed</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="padding:0.625rem;">Create Ad</button>
      </form>
    </div>
    <div id="adsList"></div>
  </div>

  <!-- Manage Posts -->
  <div class="card mb-3">
    <div class="flex items-center gap-2 mb-3">
      <i data-lucide="file-text" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
      <span class="font-bold text-sm">All Posts</span>
    </div>
    <div id="adminPostsList"></div>
    <div id="postsLoader" class="text-center py-4 hidden">
      <div class="shimmer" style="height:6rem;width:100%;"></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function escapeHtml(text) {
    if (!text) return '';
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  // School Management
  document.getElementById('toggleSchoolFormBtn').addEventListener('click', function() {
    var c = document.getElementById('schoolFormContainer');
    c.classList.toggle('hidden');
    lucide.createIcons();
  });

  document.getElementById('schoolForm').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('/api/admin/school/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: document.getElementById('schoolName').value,
        location: document.getElementById('schoolLocation').value,
        tagline: document.getElementById('schoolTagline').value,
        about: document.getElementById('schoolAbout').value
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        showToast('School created! Login: ' + data.email + ' / ' + data.password, 'success');
        document.getElementById('schoolForm').reset();
        document.getElementById('schoolFormContainer').classList.add('hidden');
        loadSchools();
      } else {
        showToast(data.error || 'Error', 'info');
      }
    })
    .catch(function() { showToast('Error creating school', 'info'); });
  });

  function loadSchools() {
    fetch('/api/admin/schools')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = document.getElementById('schoolsList');
        list.innerHTML = '';
        if (data.schools && data.schools.length > 0) {
          data.schools.forEach(function(s) {
            var el = document.createElement('div');
            el.className = 'p-3 rounded-xl mb-2';
            el.style.background = 'var(--bg-hover)';
            el.innerHTML =
              '<div class="flex items-center gap-3">' +
                '<i data-lucide="building-2" style="width:1.5rem;height:1.5rem;color:var(--primary);"></i>' +
                '<div>' +
                  '<div class="font-bold text-sm">' + escapeHtml(s.name) + '</div>' +
                  '<div class="text-xs text-muted">' + escapeHtml(s.location || '') + (s.tagline ? ' &middot; ' + escapeHtml(s.tagline) : '') + '</div>' +
                '</div>' +
              '</div>';
            list.appendChild(el);
          });
          lucide.createIcons();
        } else {
          list.innerHTML = '<div class="text-center text-muted text-sm py-4">No schools registered</div>';
        }
      })
      .catch(function() {});
  }

  // Ads Management
  document.getElementById('toggleAdFormBtn').addEventListener('click', function() {
    var c = document.getElementById('adFormContainer');
    c.classList.toggle('hidden');
    lucide.createIcons();
  });

  function loadAds() {
    fetch('/api/admin/ads')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = document.getElementById('adsList');
        list.innerHTML = '';
        if (data.ads && data.ads.length > 0) {
          data.ads.forEach(function(ad) {
            var el = document.createElement('div');
            el.className = 'flex items-center justify-between p-3 rounded-xl mb-2';
            el.style.background = 'var(--bg-hover)';
            el.innerHTML =
              '<div style="flex:1;min-width:0;">' +
                '<div class="text-sm font-bold">' + escapeHtml(ad.title) + '</div>' +
                '<div class="text-xs text-muted">' + escapeHtml(ad.company) + ' &middot; ' + escapeHtml(ad.placement || 'sidebar') + '</div>' +
                (ad.content ? '<div class="text-xs text-muted mt-1">' + escapeHtml(ad.content) + '</div>' : '') +
              '</div>' +
              '<button class="btn btn-danger btn-sm delete-ad" data-id="' + ad.id + '"><i data-lucide="trash-2" style="width:0.875rem;height:0.875rem;"></i></button>';
            list.appendChild(el);
          });
          lucide.createIcons();
          document.querySelectorAll('.delete-ad').forEach(function(btn) {
            btn.addEventListener('click', function() {
              if (!confirm('Delete this ad?')) return;
              fetch('/api/admin/ad/' + this.getAttribute('data-id') + '/delete', { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                  if (d.success) { showToast('Ad deleted', 'success'); loadAds(); }
                  else { showToast(d.error || 'Error', 'info'); }
                })
                .catch(function() {});
            });
          });
        } else {
          list.innerHTML = '<div class="text-center text-muted text-sm py-4">No ads created yet</div>';
        }
      })
      .catch(function() {});
  }

  // Posts Management
  function loadPosts() {
    document.getElementById('postsLoader').classList.remove('hidden');
    fetch('/api/admin/posts')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('postsLoader').classList.add('hidden');
        var list = document.getElementById('adminPostsList');
        list.innerHTML = '';
        if (data.posts && data.posts.length > 0) {
          data.posts.forEach(function(post) {
            var el = document.createElement('div');
            el.className = 'flex items-center justify-between p-3 rounded-xl mb-2';
            el.style.background = 'var(--bg-hover)';
            el.innerHTML =
              '<div style="flex:1;min-width:0;">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="text-sm font-bold">' + escapeHtml(post.author ? post.author.name : 'Unknown') + '</span>' +
                  (post.title ? '<span class="text-xs text-muted">- ' + escapeHtml(post.title) + '</span>' : '') +
                '</div>' +
                (post.content ? '<div class="text-xs text-muted truncate">' + escapeHtml(post.content) + '</div>' : '') +
                '<div class="text-xs text-muted mt-1">' + (post.created_at || '') + ' &middot; <span class="font-bold">' + (post.likes_count || 0) + ' likes</span></div>' +
              '</div>' +
              '<button class="btn btn-danger btn-sm delete-post" data-id="' + post.id + '"><i data-lucide="trash-2" style="width:0.875rem;height:0.875rem;"></i></button>';
            list.appendChild(el);
          });
          lucide.createIcons();
          document.querySelectorAll('.delete-post').forEach(function(btn) {
            btn.addEventListener('click', function() {
              if (!confirm('Delete this post?')) return;
              fetch('/api/admin/post/' + this.getAttribute('data-id') + '/delete', { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                  if (d.success) { showToast('Post deleted', 'success'); loadPosts(); }
                  else { showToast(d.error || 'Error', 'info'); }
                })
                .catch(function() {});
            });
          });
        } else {
          list.innerHTML = '<div class="text-center text-muted text-sm py-4">No posts yet</div>';
        }
      })
      .catch(function() { document.getElementById('postsLoader').classList.add('hidden'); });
  }

  // Ad form
  document.getElementById('adForm').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('/api/admin/ad/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: document.getElementById('adTitle').value,
        company: document.getElementById('adCompany').value,
        content: document.getElementById('adContent').value,
        cta_text: document.getElementById('adCtaText').value,
        cta_url: document.getElementById('adCtaUrl').value,
        placement: document.getElementById('adPlacement').value
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        document.getElementById('adForm').reset();
        document.getElementById('adFormContainer').classList.add('hidden');
        showToast('Ad created!', 'success');
        loadAds();
      } else {
        showToast(data.error || 'Error', 'info');
      }
    })
    .catch(function() { showToast('Error creating ad', 'info'); });
  });

  loadSchools();
  loadAds();
  loadPosts();
});
</script>
{% endblock %}
