{% extends "base.html" %}
{% block content %}
<div style="max-width:56rem;margin:0 auto;">
  <h1 class="text-xl font-black mb-4">Analytics</h1>

  <!-- Summary Cards -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem;margin-bottom:1.5rem;">
    <div class="card text-center">
      <div class="stat-num" id="summaryAchievements">0</div>
      <div class="stat-label">Total Achievements</div>
    </div>
    <div class="card text-center">
      <div class="stat-num" id="summaryVerified">0</div>
      <div class="stat-label">Verified</div>
    </div>
    <div class="card text-center">
      <div class="stat-num" id="summaryPending">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="card text-center">
      <div class="stat-num" id="summaryProjects">0</div>
      <div class="stat-label">Projects</div>
    </div>
  </div>

  <!-- Chart Row -->
  <div class="chart-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
    <!-- Bar Chart: Achievements by Category -->
    <div class="card">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="bar-chart-3" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
        <span class="font-bold text-sm">Achievements by Category</span>
      </div>
      <div style="position:relative;height:16rem;">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <!-- Doughnut Chart: Verification Status -->
    <div class="card">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="pie-chart" style="width:1.25rem;height:1.25rem;color:var(--primary);"></i>
        <span class="font-bold text-sm">Verification Status</span>
      </div>
      <div style="position:relative;height:16rem;">
        <canvas id="verificationChart"></canvas>
      </div>
    </div>
  </div>

  <div id="chartEmpty" class="text-center text-muted text-sm py-8 hidden mt-4">
    <i data-lucide="bar-chart-3" style="width:2rem;height:2rem;margin:0 auto 0.5rem;display:block;"></i>
    No data yet. Add achievements to see analytics.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
var ACHIEVEMENTS_DATA = [
  {% for a in achievements %}
  {
    category: {{ a.category|tojson|safe }},
    verification_status: {{ a.verification_status|tojson|safe }}
  }{% if not loop.last %},{% endif %}
  {% endfor %}
];
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var achievements = ACHIEVEMENTS_DATA;

  // Compute analytics from data
  var total = achievements.length;
  var verified = achievements.filter(function(a) { return a.verification_status === 'Verified'; }).length;
  var pending = achievements.filter(function(a) { return a.verification_status === 'Pending'; }).length;
  var notVerified = total - verified - pending;

  var catMap = {};
  achievements.forEach(function(a) {
    var cat = a.category || 'Other';
    catMap[cat] = (catMap[cat] || 0) + 1;
  });
  var categories = Object.keys(catMap).map(function(k) { return { name: k, count: catMap[k] }; });

  var data = {
    total: total,
    verified: verified,
    pending: pending,
    projects: 0,
    categories: categories
  };

  var empty = document.getElementById('chartEmpty');
  if (!data || (!data.categories || data.categories.length === 0) && (data.total || 0) === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // Summary cards
  document.getElementById('summaryAchievements').textContent = data.total || 0;
  document.getElementById('summaryVerified').textContent = data.verified || 0;
  document.getElementById('summaryPending').textContent = data.pending || 0;
  document.getElementById('summaryProjects').textContent = data.projects || 0;

  // Bar chart - Achievements by Category
  var catLabels = [];
  var catData = [];
  if (data.categories) {
    data.categories.forEach(function(c) {
      catLabels.push(c.name || c.category || 'Other');
      catData.push(c.count || 0);
    });
  }

  var ctx1 = document.getElementById('categoryChart').getContext('2d');
  new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: catLabels,
      datasets: [{
        label: 'Achievements',
        data: catData,
        backgroundColor: [
          'rgba(10,102,194,0.7)',
          'rgba(249,115,22,0.7)',
          'rgba(16,185,129,0.7)',
          'rgba(139,92,246,0.7)',
          'rgba(239,68,68,0.7)',
          'rgba(245,158,11,0.7)'
        ],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1 }
        }
      }
    }
  });

  // Doughnut chart - Verification Status
  var ctx2 = document.getElementById('verificationChart').getContext('2d');
  new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Verified', 'Pending', 'Not Verified'],
      datasets: [{
        data: [
          data.verified || 0,
          data.pending || 0,
          (data.total - data.verified - data.pending) || 0
        ],
        backgroundColor: [
          'rgba(16,185,129,0.8)',
          'rgba(245,158,11,0.8)',
          'rgba(148,163,184,0.8)'
        ],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 } }
        }
      }
    }
  });
});
</script>
{% endblock %}
