{% extends "base.html" %}
{% block content %}
<div>
  <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <div>
      <h1 class="text-xl font-black">Opportunities</h1>
      <p class="text-sm text-muted">Discover competitions, scholarships, and programs</p>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <div class="relative flex-1 sm:flex-none" style="max-width:16rem;">
        <i data-lucide="search" class="search-icon" style="width:1rem;height:1rem;"></i>
        <input type="text" id="oppSearch" placeholder="Search..." class="w-full">
      </div>
      {% if current_user.role in ('admin','super_admin','teacher','mentor') %}
      <button class="btn btn-primary btn-sm whitespace-nowrap" onclick="document.getElementById('oppFormModal').classList.remove('hidden')"><i data-lucide="plus" style="width:14px;height:14px;"></i> Post</button>
      {% endif %}
    </div>
  </div>

  <!-- Filters -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1" style="scrollbar-width:none;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;">
    <button class="btn btn-sm opp-filter active" data-type="all" style="background:var(--primary);color:#fff;flex-shrink:0;">All</button>
    <button class="btn btn-sm opp-filter btn-outline" data-type="competition" style="flex-shrink:0;">Competitions</button>
    <button class="btn btn-sm opp-filter btn-outline" data-type="scholarship" style="flex-shrink:0;">Scholarships</button>
    <button class="btn btn-sm opp-filter btn-outline" data-type="internship" style="flex-shrink:0;">Internships</button>
    <button class="btn btn-sm opp-filter btn-outline" data-type="program" style="flex-shrink:0;">Programs</button>
    <button class="btn btn-sm opp-filter btn-outline" data-type="workshop" style="flex-shrink:0;">Workshops</button>
  </div>

  <!-- Opportunities Grid -->
  <div id="oppGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:1rem;"></div>

  <div id="oppLoader" class="text-center py-4 hidden">
    <div class="shimmer" style="height:12rem;width:100%;max-width:20rem;margin:0 auto;"></div>
  </div>
  <div id="oppEmpty" class="text-center text-muted text-sm py-8 hidden">
    <i data-lucide="search-x" style="width:2rem;height:2rem;margin:0 auto 0.5rem;display:block;"></i>
    No opportunities found
  </div>
</div>

<!-- Post Opportunity Modal -->
<div id="oppFormModal" class="hidden" style="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="card" style="max-width:28rem;width:100%;max-height:90vh;overflow-y:auto;">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold">Post Opportunity</h2>
      <button class="btn btn-sm" onclick="document.getElementById('oppFormModal').classList.add('hidden')"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <form id="oppForm" onsubmit="event.preventDefault();postOpportunity();">
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Title</label>
        <input type="text" id="oppName" class="w-full" required placeholder="e.g. National Science Olympiad">
      </div>
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Type</label>
        <select id="oppType" class="w-full">
          <option value="competition">Competition</option>
          <option value="scholarship">Scholarship</option>
          <option value="internship">Internship</option>
          <option value="program">Program</option>
          <option value="workshop">Workshop</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Provider</label>
        <input type="text" id="oppProvider" class="w-full" placeholder="e.g. NCERT, IIT Delhi">
      </div>
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Prize / Stipend</label>
        <input type="text" id="oppPrize" class="w-full" placeholder="e.g. ₹50,000">
      </div>
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Description</label>
        <textarea id="oppDesc" rows="3" class="w-full" placeholder="Describe the opportunity..."></textarea>
      </div>
      <div class="mb-2">
        <label class="text-xs font-bold text-muted block mb-1">Eligibility</label>
        <input type="text" id="oppElig" class="w-full" placeholder="e.g. Grade IX-XII students">
      </div>
      <div class="mb-3">
        <label class="text-xs font-bold text-muted block mb-1">Deadline</label>
        <input type="date" id="oppDeadline" class="w-full">
      </div>
      <button type="submit" class="btn btn-primary w-full" style="padding:0.625rem;">Post Opportunity</button>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var currentFilter = 'all';
  var allOpportunities = [];

  function loadOpportunities() {
    document.getElementById('oppLoader').classList.remove('hidden');
    fetch('/api/opportunities')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('oppLoader').classList.add('hidden');
        allOpportunities = data.opportunities || [];
        renderOpportunities();
      })
      .catch(function() {
        document.getElementById('oppLoader').classList.add('hidden');
        document.getElementById('oppEmpty').classList.remove('hidden');
        document.getElementById('oppEmpty').querySelector('span').textContent = 'Failed to load opportunities';
      });
  }

  function renderOpportunities() {
    var grid = document.getElementById('oppGrid');
    var empty = document.getElementById('oppEmpty');
    grid.innerHTML = '';
    var filtered = allOpportunities;
    if (currentFilter !== 'all') {
      filtered = allOpportunities.filter(function(o) { return o.type === currentFilter; });
    }
    if (filtered.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    filtered.forEach(function(opp) {
      var el = document.createElement('div');
      el.className = 'card flex flex-col';
      var deadline = opp.deadline ? new Date(opp.deadline).toLocaleDateString() : 'No deadline';
      el.innerHTML =
        '<div class="flex items-start justify-between mb-2">' +
          '<span class="badge badge-primary">' + escapeHtml(opp.type || 'opportunity') + '</span>' +
          (opp.prize_pool ? '<span class="font-bold text-sm" style="color:var(--accent);">' + escapeHtml(opp.prize_pool) + '</span>' : '') +
        '</div>' +
        '<h3 class="font-bold text-sm">' + escapeHtml(opp.name) + '</h3>' +
        (opp.provider ? '<div class="text-xs text-muted mb-1">by ' + escapeHtml(opp.provider) + '</div>' : '') +
        (opp.description ? '<p class="text-xs text-muted mt-1" style="line-height:1.5;">' + escapeHtml(opp.description) + '</p>' : '') +
        (opp.eligibility ? '<div class="text-xs mt-2"><span class="font-bold">Eligibility:</span> ' + escapeHtml(opp.eligibility) + '</div>' : '') +
        '<div class="flex items-center justify-between mt-3 pt-3" style="border-top:1px solid var(--border);margin-top:auto;">' +
          '<span class="text-xs text-muted"><i data-lucide="clock" style="width:0.75rem;height:0.75rem;display:inline;"></i> ' + deadline + '</span>' +
          '<button class="btn btn-primary btn-sm apply-btn" data-id="' + opp.id + '">Apply Now</button>' +
        '</div>';
      grid.appendChild(el);
    });
    lucide.createIcons();

    // Apply buttons
    document.querySelectorAll('.apply-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        var originalText = this.textContent;
        this.textContent = 'Applying...';
        this.disabled = true;
        fetch('/api/opportunity/' + id + '/apply', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              showToast('Applied successfully!', 'success');
              btn.textContent = 'Applied';
              btn.classList.remove('btn-primary');
              btn.classList.add('btn-success');
            } else {
              showToast(data.error || 'Error applying', 'info');
              btn.textContent = originalText;
              btn.disabled = false;
            }
          })
          .catch(function() {
            showToast('Error applying', 'info');
            btn.textContent = originalText;
            btn.disabled = false;
          });
      });
    });
  }

  // Filter buttons
  document.querySelectorAll('.opp-filter').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.opp-filter').forEach(function(b) {
        b.className = 'btn btn-sm opp-filter btn-outline';
      });
      this.className = 'btn btn-sm opp-filter active';
      this.style.background = 'var(--primary)';
      this.style.color = '#fff';
      currentFilter = this.getAttribute('data-type');
      renderOpportunities();
    });
  });

  // Search
  document.getElementById('oppSearch').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    if (q.length > 1) {
      var grid = document.getElementById('oppGrid');
      grid.querySelectorAll('.card').forEach(function(card) {
        var text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    } else {
      grid.querySelectorAll('.card').forEach(function(card) { card.style.display = 'flex'; });
    }
  });

  function escapeHtml(text) {
    if (!text) return '';
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function postOpportunity() {
    var body = {
      name: document.getElementById('oppName').value,
      type: document.getElementById('oppType').value,
      provider: document.getElementById('oppProvider').value,
      prize_pool: document.getElementById('oppPrize').value,
      description: document.getElementById('oppDesc').value,
      eligibility: document.getElementById('oppElig').value,
      deadline: document.getElementById('oppDeadline').value
    };
    fetch('/api/opportunity/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        showToast('Opportunity posted!', 'success');
        document.getElementById('oppFormModal').classList.add('hidden');
        document.getElementById('oppForm').reset();
        loadOpportunities();
      } else {
        showToast(data.error || 'Error posting', 'info');
      }
    })
    .catch(function() { showToast('Network error', 'info'); });
  }

  loadOpportunities();
});
</script>
{% endblock %}
